<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" role="img" aria-label="How VeritasMed turns a question into a checkable answer: understand, retrieve, bind each part of the question to exact source sentences or report a gap, write and self-check with bounded retries; each claim is linked to its sentence, and a one-click audit checks every claim against the same passages."><title>How VeritasMed turns a question into a checkable answer: understand, retrieve, bind each part of the question to exact source sentences or report a gap, write and self-check with bounded retries; each claim is linked to its sentence, and a one-click audit checks every claim against the same passages.</title><defs><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E9A9F"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8CC5D0"/></marker></defs><text x="24" y="34" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F4F5F1" text-anchor="start">Your question</text><line x1="119" y1="44" x2="119" y2="93" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><rect x="24" y="96" width="190" height="112" rx="10" fill="#141D24" stroke="#33434A" stroke-width="1.2"/><text x="40" y="123" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#F4F5F1" text-anchor="start">1  Understand</text><text x="40" y="148" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">Follow-ups resolved from</text><text x="40" y="165" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">earlier turns: context,</text><text x="40" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">never evidence</text><rect x="278" y="96" width="190" height="112" rx="10" fill="#141D24" stroke="#33434A" stroke-width="1.2"/><text x="294" y="123" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#F4F5F1" text-anchor="start">2  Retrieve</text><text x="294" y="148" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">BGE-M3 dense + sparse,</text><text x="294" y="165" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">fused and reranked; the</text><text x="294" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">named paper first</text><rect x="532" y="96" width="190" height="112" rx="10" fill="#141D24" stroke="#8CC5D0" stroke-width="2"/><text x="548" y="123" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#8CC5D0" text-anchor="start">3  Bind evidence</text><text x="548" y="148" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">Each part of the question</text><text x="548" y="165" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">→ exact sentence IDs.</text><text x="548" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">Nothing found → a gap</text><rect x="786" y="96" width="190" height="112" rx="10" fill="#141D24" stroke="#33434A" stroke-width="1.2"/><text x="802" y="123" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#F4F5F1" text-anchor="start">4  Write and check</text><text x="802" y="148" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">Plain words, conclusion</text><text x="802" y="165" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">first; reviewed for</text><text x="802" y="182" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">support and scope</text><line x1="218" y1="152.0" x2="274" y2="152.0" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><text x="246" y="144.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="middle">query</text><line x1="472" y1="152.0" x2="528" y2="152.0" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><text x="500" y="144.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="middle">passages</text><line x1="726" y1="152.0" x2="782" y2="152.0" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><text x="754" y="144.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="middle">sentences</text><path d="M 602 94 C 572 40, 428 40, 398 92" fill="none" stroke="#8E9A9F" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#head-muted)"/><text x="500.0" y="42" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="middle">weak evidence → search again (≤2)</text><path d="M 926 94 C 926 46, 836 46, 836 92" fill="none" stroke="#8E9A9F" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#head-muted)"/><text x="881" y="42" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="middle">unsupported → repair (≤2)</text><rect x="278" y="246" width="190" height="50" rx="8" fill="#1A252D" stroke="#33434A" stroke-width="1.2"/><text x="294" y="267" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F4F5F1" text-anchor="start">Literature index</text><text x="294" y="285" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#C2CBCE" text-anchor="start">Qdrant · abstract passages</text><line x1="348" y1="211" x2="348" y2="243" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><line x1="398" y1="243" x2="398" y2="211" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><text x="342" y="233" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="end">search</text><text x="404" y="233" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="start">passages</text><line x1="881" y1="211" x2="881" y2="333" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><text x="887" y="324" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="start">answer</text><rect x="532" y="336" width="444" height="150" rx="10" fill="#141D24" stroke="#33434A" stroke-width="1.2"/><text x="550" y="362" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#8E9A9F" text-anchor="start">CITED ANSWER</text><text x="550" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#F4F5F1" text-anchor="start">Severe hypoglycemia: glargine 0.8%,</text><text x="550" y="412" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#F4F5F1" text-anchor="start">glimepiride 1.3%, liraglutide 0.5%</text><rect x="808" y="398" width="22" height="19" rx="5" fill="#1F3940" stroke="#8CC5D0"/><text x="819" y="412" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#8CC5D0" text-anchor="middle">1</text><text x="550" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#C2CBCE" text-anchor="start" font-style="italic">Five-year mortality: not in the sources</text><rect x="550" y="456" width="96" height="20" rx="10" fill="none" stroke="#E2A04D"/><text x="598" y="470" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#E2A04D" text-anchor="middle">reported gap</text><rect x="24" y="336" width="446" height="150" rx="10" fill="#141D24" stroke="#33434A" stroke-width="1.2"/><text x="42" y="362" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#8E9A9F" text-anchor="start">SOURCE SENTENCE · PMC11567630 · RESULTS</text><rect x="38" y="374" width="418" height="74" rx="6" fill="#1F3940"/><rect x="38" y="374" width="3" height="74" fill="#8CC5D0"/><text x="52" y="396" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#F4F5F1" text-anchor="start">“While participants were taking their assigned</text><text x="52" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#F4F5F1" text-anchor="start">medications, severe hypoglycemia occurred in</text><text x="52" y="436" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#F4F5F1" text-anchor="start">10 (0.8%), 16 (1.3%), 6 (0.5%) and 4 (0.3%) …”</text><text x="42" y="470" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#C2CBCE" text-anchor="start">Shown beside the claim; quoted exactly, located once.</text><path d="M 819 417 L 819 422 Q 819 428 813 428 L 474 428" fill="none" stroke="#8CC5D0" stroke-width="2" marker-end="url(#head-teal)"/><text x="501.0" y="420" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8CC5D0" text-anchor="middle">bound to</text><line x1="754.0" y1="489" x2="754.0" y2="537" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><text x="762.0" y="519" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="start">one click</text><line x1="247.0" y1="489" x2="247.0" y2="537" stroke="#8E9A9F" stroke-width="1.4" marker-end="url(#head-muted)"/><text x="255.0" y="519" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8E9A9F" text-anchor="start">same passages</text><rect x="24" y="540" width="952" height="112" rx="10" fill="#141D24" stroke="#33434A" stroke-width="1.2"/><text x="44" y="570" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="650" fill="#F4F5F1" text-anchor="start">Claim audit</text><text x="44" y="594" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">Every claim is checked against</text><text x="44" y="611" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">exact source quotes. The answer</text><text x="44" y="628" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">itself is never rewritten.</text><rect x="330" y="562" width="104" height="24" rx="12" fill="#141D24" stroke="#6CC08F" stroke-width="1.2"/><circle cx="343" cy="574" r="4" fill="#6CC08F"/><text x="353" y="578.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#F4F5F1" text-anchor="start">Supported</text><rect x="446" y="562" width="128" height="24" rx="12" fill="#141D24" stroke="#E2A04D" stroke-width="1.2"/><circle cx="459" cy="574" r="4" fill="#E2A04D"/><text x="469" y="578.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#F4F5F1" text-anchor="start">Not supported</text><rect x="586" y="562" width="140" height="24" rx="12" fill="#141D24" stroke="#9AA5AA" stroke-width="1.2"/><circle cx="599" cy="574" r="4" fill="#9AA5AA"/><text x="609" y="578.5" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#F4F5F1" text-anchor="start">Quote not found</text><text x="330" y="614" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#C2CBCE" text-anchor="start">Unchecked text stays visible; nothing is hidden or averaged.</text><rect x="752" y="562" width="204" height="70" rx="8" fill="none" stroke="#E2A04D" stroke-dasharray="3 3"/><text x="766" y="584" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#E2A04D" text-anchor="start">⚠ Flags “no difference” claims</text><text x="766" y="600" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#E2A04D" text-anchor="start">resting on a non-significant</text><text x="766" y="616" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#E2A04D" text-anchor="start">result</text></svg>
