<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img">
<title>关键节点内部：模型判断与程序规则各做什么</title><desc>当前实现的职责图 · 绑定证明原句位置，不能证明语义正确</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#647273"/></marker></defs>
<rect width="1600" height="100%" fill="#faf9f5"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#203436">
<text x="50" y="44" font-size="18" fill="#296789" font-weight="normal">VERITASMED / v0.8 / DOCUMENTATION</text>
<text x="50" y="91" font-size="34" fill="#203436" font-weight="bold">关键节点内部：模型判断与程序规则各做什么</text>
<text x="50" y="129" font-size="21" fill="#647273" font-weight="normal">当前实现的职责图 · 绑定证明原句位置，不能证明语义正确</text>
<rect x="50" y="178" width="485" height="774" rx="12" stroke="#d8dedc" stroke-width="2" fill="#ffffff"/>
<text x="70" y="226" font-size="27" fill="#203436" font-weight="bold">grade · 绑定回答要点</text>
<rect x="66" y="270" width="453" height="115" rx="12" stroke="#647273" stroke-width="2" fill="#f5f6f3"/>
<text x="82" y="300" font-size="18" fill="#647273" font-weight="bold">输入</text>
<text x="82" y="334" font-size="19" fill="#203436" font-weight="normal">原问题、已匹配研究</text>
<text x="82" y="363" font-size="19" fill="#203436" font-weight="normal">来源句 ID 与原文片段</text>
<rect x="66" y="402" width="453" height="115" rx="12" stroke="#296789" stroke-width="2" fill="#edf5fa"/>
<text x="82" y="432" font-size="18" fill="#296789" font-weight="bold">模型处理</text>
<text x="82" y="466" font-size="19" fill="#203436" font-weight="normal">构造要点提纲，选择支持句 ID</text>
<text x="82" y="495" font-size="19" fill="#203436" font-weight="normal">保留缺口；给出相关性评分</text>
<rect x="66" y="534" width="453" height="115" rx="12" stroke="#647273" stroke-width="2" fill="#f5f6f3"/>
<text x="82" y="564" font-size="18" fill="#647273" font-weight="bold">程序处理</text>
<text x="82" y="598" font-size="19" fill="#203436" font-weight="normal">解析原句、chunk 和引文</text>
<text x="82" y="627" font-size="19" fill="#203436" font-weight="normal">核对数值与来源角色等窄规则</text>
<rect x="66" y="666" width="453" height="115" rx="12" stroke="#28745b" stroke-width="2" fill="#edf5ef"/>
<text x="82" y="696" font-size="18" fill="#28745b" font-weight="bold">输出</text>
<text x="82" y="730" font-size="19" fill="#203436" font-weight="normal">answer_components / gaps</text>
<text x="82" y="759" font-size="19" fill="#203436" font-weight="normal">relevance_score / rewrite_hint</text>
<rect x="66" y="798" width="453" height="115" rx="12" stroke="#a9691e" stroke-width="2" fill="#fcf3e5"/>
<text x="82" y="828" font-size="18" fill="#a9691e" font-weight="bold">分支 / 边界</text>
<text x="82" y="862" font-size="19" fill="#203436" font-weight="normal">达到问题类型阈值 → generate</text>
<text x="82" y="891" font-size="19" fill="#203436" font-weight="normal">否则有预算 → rewrite；耗尽 → 尽力生成</text>
<rect x="565" y="178" width="485" height="774" rx="12" stroke="#d8dedc" stroke-width="2" fill="#ffffff"/>
<text x="585" y="226" font-size="27" fill="#203436" font-weight="bold">generate · 生成与补写</text>
<rect x="581" y="270" width="453" height="115" rx="12" stroke="#647273" stroke-width="2" fill="#f5f6f3"/>
<text x="597" y="300" font-size="18" fill="#647273" font-weight="bold">输入</text>
<text x="597" y="334" font-size="19" fill="#203436" font-weight="normal">问题、绑定要点、原句</text>
<text x="597" y="363" font-size="19" fill="#203436" font-weight="normal">修复轮附带指定问题项</text>
<rect x="581" y="402" width="453" height="115" rx="12" stroke="#296789" stroke-width="2" fill="#edf5fa"/>
<text x="597" y="432" font-size="18" fill="#296789" font-weight="bold">模型处理</text>
<text x="597" y="466" font-size="19" fill="#203436" font-weight="normal">逐要点生成带引用的 claim</text>
<text x="597" y="495" font-size="19" fill="#203436" font-weight="normal">只替换被指出的修复项</text>
<rect x="581" y="534" width="453" height="115" rx="12" stroke="#647273" stroke-width="2" fill="#f5f6f3"/>
<text x="597" y="564" font-size="18" fill="#647273" font-weight="bold">程序处理</text>
<text x="597" y="598" font-size="19" fill="#203436" font-weight="normal">拒绝未知要点 / 错误来源</text>
<text x="597" y="627" font-size="19" fill="#203436" font-weight="normal">保留原句；恢复遗漏的数值与方法细节</text>
<rect x="581" y="666" width="453" height="115" rx="12" stroke="#28745b" stroke-width="2" fill="#edf5ef"/>
<text x="597" y="696" font-size="18" fill="#28745b" font-weight="bold">输出</text>
<text x="597" y="730" font-size="19" fill="#203436" font-weight="normal">answer / citations / answer_claims</text>
<text x="597" y="759" font-size="19" fill="#203436" font-weight="normal">evidence_status / binding issues</text>
<rect x="581" y="798" width="453" height="115" rx="12" stroke="#a9691e" stroke-width="2" fill="#fcf3e5"/>
<text x="597" y="828" font-size="18" fill="#a9691e" font-weight="bold">分支 / 边界</text>
<text x="597" y="862" font-size="19" fill="#203436" font-weight="normal">生成后进入 check</text>
<text x="597" y="891" font-size="19" fill="#203436" font-weight="normal">覆盖标签不等于医学正确</text>
<rect x="1080" y="178" width="485" height="774" rx="12" stroke="#d8dedc" stroke-width="2" fill="#ffffff"/>
<text x="1100" y="226" font-size="27" fill="#203436" font-weight="bold">check · 图内检查</text>
<rect x="1096" y="270" width="453" height="115" rx="12" stroke="#647273" stroke-width="2" fill="#f5f6f3"/>
<text x="1112" y="300" font-size="18" fill="#647273" font-weight="bold">输入</text>
<text x="1112" y="334" font-size="19" fill="#203436" font-weight="normal">原问题、提纲、答案</text>
<text x="1112" y="363" font-size="19" fill="#203436" font-weight="normal">所选研究与原文</text>
<rect x="1096" y="402" width="453" height="115" rx="12" stroke="#296789" stroke-width="2" fill="#edf5fa"/>
<text x="1112" y="432" font-size="18" fill="#296789" font-weight="bold">模型处理</text>
<text x="1112" y="466" font-size="19" fill="#203436" font-weight="normal">核查支持、完整性与证据边界</text>
<text x="1112" y="495" font-size="19" fill="#203436" font-weight="normal">指出问题并选择定向修复项</text>
<rect x="1096" y="534" width="453" height="115" rx="12" stroke="#647273" stroke-width="2" fill="#f5f6f3"/>
<text x="1112" y="564" font-size="18" fill="#647273" font-weight="bold">程序处理</text>
<text x="1112" y="598" font-size="19" fill="#203436" font-weight="normal">检查必需数值存在等窄规则</text>
<text x="1112" y="627" font-size="19" fill="#203436" font-weight="normal">保留不支持推断的拒绝</text>
<rect x="1096" y="666" width="453" height="115" rx="12" stroke="#28745b" stroke-width="2" fill="#edf5ef"/>
<text x="1112" y="696" font-size="18" fill="#28745b" font-weight="bold">输出</text>
<text x="1112" y="730" font-size="19" fill="#203436" font-weight="normal">faithful / faithfulness_issues</text>
<text x="1112" y="759" font-size="19" fill="#203436" font-weight="normal">repair_component_ids</text>
<rect x="1096" y="798" width="453" height="115" rx="12" stroke="#a9691e" stroke-width="2" fill="#fcf3e5"/>
<text x="1112" y="828" font-size="18" fill="#a9691e" font-weight="bold">分支 / 边界</text>
<text x="1112" y="862" font-size="19" fill="#203436" font-weight="normal">通过 → 保存；否则有预算 → 修复</text>
<text x="1112" y="891" font-size="19" fill="#203436" font-weight="normal">预算耗尽 → 保留问题后保存</text>
<text x="50" y="1005" font-size="21" fill="#647273" font-weight="normal">规则是有限的保护与恢复机制；一次节点执行可以包含多次模型调用。独立 Audit 不在这条修复链中。</text>
</g></svg>
