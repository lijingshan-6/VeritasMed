    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23685f" x="63.504" y="202.877813" transform="rotate(-0 63.504 202.877813)">01 / Unchanged answer fragments</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 252.565781)">"severe hypoglycemia occurred in 10 (0.8%)"</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 270.390781)">"following randomization to glargine"</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 288.743164)">Offsets: 79–120 and 266–301; end exclusive.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #aa702a" x="551.88" y="202.877813" transform="rotate(-0 551.88 202.877813)">02 / Explicit condition anchor</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 252.565781)">"While participants were taking their assigned</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 271.504844)">medications"</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 288.215781)">Unique parent-scoped match: 20–77.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23685f" x="63.504" y="439.253812" transform="rotate(-0 63.504 439.253812)">03 / Model-parsed interpretation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 488.941781)">The study reports [PMC:PMC11567630] that, while</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 506.766781)">participants were taking their assigned medications,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 524.591781)">severe hypoglycemia occurred in 10 (0.8%) of participants</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 542.416781)">following randomization to glargine.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 557.0685)"/>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(63.504 577.932016)">Relation: supported  |  Fact status: ok</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #556ba0" x="551.88" y="439.253812" transform="rotate(-0 551.88 439.253812)">04 / Source passage + fingerprint</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 489.60393)">PMC11567630 / Abstract / Results</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 506.766781)">evidence-1: 0–349; supplied text</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 525.705844)">bab600fe30235c85d53be52fe0…</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 539.2435)"/>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #223a37" transform="translate(551.88 560.081859)">Whole run: partial_error</text>
