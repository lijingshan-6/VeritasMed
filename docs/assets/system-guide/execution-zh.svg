<rect x="695" y="215" width="855" height="235" rx="12" stroke="#d8dedc" stroke-width="2" fill="#ffffff"/>
<text x="720" y="253" font-size="24" fill="#203436" font-weight="bold">原始问题（保持原文）</text>
<text x="720" y="300" font-size="23" fill="#203436" font-weight="normal">Quote the abstract sentence describing how long the glucose</text>
<text x="720" y="333" font-size="23" fill="#203436" font-weight="normal">decrease persisted, and state whether that sentence supplies a</text>
<text x="720" y="366" font-size="23" fill="#203436" font-weight="normal">five-year mortality result.</text>
<rect x="695" y="478" width="855" height="285" rx="12" stroke="#a9691e" stroke-width="2" fill="#fcf3e5"/>
<text x="720" y="518" font-size="25" fill="#a9691e" font-weight="bold">最后一次 check 仍报告遗漏</text>
<text x="720" y="558" font-size="23" fill="#a9691e" font-weight="normal">faithful: false → false → false</text>
<text x="720" y="605" font-size="19" fill="#203436" font-weight="normal">The answer correctly quotes the abstract sentence about glucose decrease</text>
<text x="720" y="634" font-size="19" fill="#203436" font-weight="normal">persisting for approximately 3 hours. However, it omits the required statement</text>
<text x="720" y="663" font-size="19" fill="#203436" font-weight="normal">that this sentence does not supply a five-year mortality result. Add that no</text>
<text x="720" y="692" font-size="19" fill="#203436" font-weight="normal">five-year mortality result is provided by the quoted sentence.</text>
<rect x="695" y="792" width="855" height="145" rx="12" stroke="#647273" stroke-width="2" fill="#f1f3f0"/>
<text x="720" y="831" font-size="24" fill="#203436" font-weight="bold">最终返回字段（与中间草稿分开）</text>
<text x="720" y="876" font-size="21" fill="#203436" font-weight="normal">faithful = false / regen_count = 2 / iterations = 0</text>
<text x="720" y="907" font-size="21" fill="#203436" font-weight="normal">最后观察到：check → append_history</text>
<rect x="695" y="965" width="855" height="190" rx="12" stroke="#647273" stroke-width="2" fill="#ffffff"/>
<text x="720" y="1007" font-size="24" fill="#203436" font-weight="bold">未保存的内容</text>
<text x="720" y="1050" font-size="21" fill="#647273" font-weight="normal">完整节点输入、内部提示、当时提纲与各次完整草稿。</text>
<text x="720" y="1081" font-size="21" fill="#647273" font-weight="normal">事件完成 ≠ 判断通过；自检通过 ≠ 回答可靠。</text>
<text x="720" y="1112" font-size="21" fill="#647273" font-weight="normal">这次图内检查不是答案之后单独运行的 Audit。</text>
<text x="50" y="1210" font-size="20" fill="#647273" font-weight="normal">耗时含调度 / 传输；原始事件未输出计数和摘要辅助节点。</text>
<text x="50" y="1240" font-size="20" fill="#647273" font-weight="normal">来源：v08-evidence-limits-turn-3-events.jsonl。演示案例不是独立可靠性测试集。</text>
